name: DFTDesk Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install ASE and DOS analysis dependencies for integration testing
        run: python -m pip install ase pymatgen numpy matplotlib openpyxl

      - name: Test DFTDesk ASE conversion and file safety
        env:
          DFTDESK_TEST_ASE_PYTHON: python
        run: dotnet test tests/DFTDesk.Tests/DFTDesk.Tests.csproj -c Release

      - name: Test VASP DOSCAR parsing, spin PDOS and image/CSV export
        run: python -m unittest discover -s tests -p test_dos_analyzer.py

      - name: Test LOBSTER COHP and ICOHP parsing, Excel/Origin/image export
        run: python -m unittest discover -s tests -p test_cohp_analyzer.py

      - name: Test HER and repeated-layout ORR/OER reaction step plotting
        run: python -m unittest discover -s tests -p test_step_diagram.py

      - name: Test Origin 2024 native OPJU export mapping with a mocked Origin engine
        run: python -m unittest discover -s tests -p test_origin_project_export.py

      - name: Test pymatgen surface-adsorbate Pourbaix mapping and exports
        run: python -m unittest discover -s tests -p test_surface_pourbaix.py

      - name: Generate downloadable HER and ORR/OER Excel input templates
        run: |
          python src/DFTDesk/StepScripts/step_diagram.py --action template --mode HER --outdir dist/step-templates
          python src/DFTDesk/StepScripts/step_diagram.py --action template --mode ORR --outdir dist/step-templates

      - name: Upload fill-in Excel templates
        uses: actions/upload-artifact@v7
        with:
          name: DFTDesk-step-templates
          path: dist/step-templates/*.xlsx
          if-no-files-found: error

      - name: Build DFTDesk 2.3.10 and blank original HER/ORR/OER templates
        run: dotnet build src/DFTDesk/DFTDesk.csproj -c Release

      - name: Prepare optional private donation QR assets
        shell: pwsh
        env:
          DFTDESK_WECHAT_QR_BASE64: ${{ secrets.DFTDESK_WECHAT_QR_BASE64 }}
          DFTDESK_ALIPAY_QR_BASE64: ${{ secrets.DFTDESK_ALIPAY_QR_BASE64 }}
        run: |
          $wechat = $env:DFTDESK_WECHAT_QR_BASE64
          $alipay = $env:DFTDESK_ALIPAY_QR_BASE64
          if (-not [string]::IsNullOrWhiteSpace($wechat) -and -not [string]::IsNullOrWhiteSpace($alipay)) {
            try {
              $wechatBytes = [Convert]::FromBase64String($wechat.Trim())
              $alipayBytes = [Convert]::FromBase64String($alipay.Trim())
              $pngSignature = '89504E470D0A1A0A'
              if ($wechatBytes.Length -lt 8 -or $alipayBytes.Length -lt 8 -or
                  [Convert]::ToHexString($wechatBytes[0..7]) -ne $pngSignature -or
                  [Convert]::ToHexString($alipayBytes[0..7]) -ne $pngSignature) {
                throw 'QR secrets must encode PNG images.'
              }
              $dir = Join-Path $env:LOCALAPPDATA 'DFTDesk\Donation'
              New-Item -ItemType Directory -Force -Path $dir | Out-Null
              [IO.File]::WriteAllBytes((Join-Path $dir 'wechat.png'), $wechatBytes)
              [IO.File]::WriteAllBytes((Join-Path $dir 'alipay.png'), $alipayBytes)
              Write-Host 'Valid private donation QR PNG files prepared for embedding.'
            } catch {
              Write-Warning 'Donation QR secrets are not valid Base64 PNG files. Skipping embedded QR images; correct both GitHub Actions secrets.'
            }
          } else {
            Write-Host 'Donation QR secrets not configured. No private QR data included.'
          }

      - name: Publish DFTDesk self-contained Windows EXE
        run: dotnet publish src/DFTDesk/DFTDesk.csproj -c Release -r win-x64 --self-contained true -o dist/build

      - name: Package standalone DFTDesk
        shell: pwsh
        run: |
          $exe = 'dist/build/DFTDesk.exe'
          if (-not (Test-Path $exe -PathType Leaf)) { throw 'DFTDesk.exe was not created.' }
          $release = 'dist/DFTDesk-Release'
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          Copy-Item $exe (Join-Path $release 'DFTDesk.exe')
          Copy-Item LICENSE (Join-Path $release 'LICENSE.txt')
          Copy-Item src/DFTDesk/README.md (Join-Path $release 'README.txt')
          $actual = @(Get-ChildItem -Path $release -File | Select-Object -ExpandProperty Name | Sort-Object)
          $expected = @('DFTDesk.exe', 'LICENSE.txt', 'README.txt')
          if (@(Compare-Object $actual $expected).Count -ne 0) {
            throw "Unexpected release files: $($actual -join ', ')"
          }
          Get-ChildItem -Path $release | Format-Table Name,Length

      - name: Smoke-test EXE without sidecar DLLs
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/DFTDesk-Release/DFTDesk.exe').Path
          $process = Start-Process -FilePath $exe -PassThru -ErrorAction Stop
          try {
            Start-Sleep -Seconds 6
            $process.Refresh()
            if ($process.HasExited) { throw "DFTDesk.exe exited during startup ($($process.ExitCode))." }
            Write-Host 'DFTDesk independent release executable is running.'
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Upload portable DFTDesk
        uses: actions/upload-artifact@v7
        with:
          name: DFTDesk-win-x64
          path: dist/DFTDesk-Release/
          if-no-files-found: error
