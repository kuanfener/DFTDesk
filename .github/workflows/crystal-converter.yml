name: Crystal Converter (standalone)

on:
  pull_request:
    paths:
      - tools/CrystalConverter/**
      - tools/CrystalConverter.Tests/**
      - .github/workflows/crystal-converter.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test POSCAR and CIF conversion
        run: dotnet test tools/CrystalConverter.Tests/CrystalConverter.Tests.csproj -c Release

      - name: Publish standalone Windows x64 EXE
        run: dotnet publish tools/CrystalConverter/CrystalConverter.csproj -c Release -r win-x64 --self-contained true -o dist/DFTDesk

      - name: Include license and README
        run: |
          Copy-Item LICENSE dist/DFTDesk/LICENSE-Filee.txt
          Copy-Item tools/CrystalConverter/README.md dist/DFTDesk/README.txt

      - name: Upload portable EXE
        uses: actions/upload-artifact@v7
        with:
          name: DFTDesk-win-x64
          path: dist/DFTDesk/
          if-no-files-found: error
