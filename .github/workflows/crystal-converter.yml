name: Crystal Converter (standalone)

on:
  pull_request:
    paths:
      - tools/CrystalConverter/**
      - tools/CrystalConverter.Tests/**
      - .github/workflows/crystal-converter.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test POSCAR and CIF conversion
        run: dotnet test tools/CrystalConverter.Tests/CrystalConverter.Tests.csproj -c Release

      - name: Prepare private donation QR resources (optional)
        shell: pwsh
        env:
          DFTDESK_WECHAT_QR_BASE64: ${{ secrets.DFTDESK_WECHAT_QR_BASE64 }}
          DFTDESK_ALIPAY_QR_BASE64: ${{ secrets.DFTDESK_ALIPAY_QR_BASE64 }}
        run: |
          $wechat = $env:DFTDESK_WECHAT_QR_BASE64
          $alipay = $env:DFTDESK_ALIPAY_QR_BASE64
          if (-not [string]::IsNullOrWhiteSpace($wechat) -and -not [string]::IsNullOrWhiteSpace($alipay)) {
            $dir = Join-Path $env:LOCALAPPDATA 'DFTDesk\Donation'
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            [IO.File]::WriteAllBytes((Join-Path $dir 'wechat.png'), [Convert]::FromBase64String($wechat))
            [IO.File]::WriteAllBytes((Join-Path $dir 'alipay.png'), [Convert]::FromBase64String($alipay))
            Write-Host 'Private donation QR resources prepared for embedding.'
          } else {
            Write-Host 'Donation QR secrets are not configured; the sponsor dialog will show local setup instructions.'
          }

      - name: Publish standalone Windows x64 EXE
        run: dotnet publish tools/CrystalConverter/CrystalConverter.csproj -c Release -r win-x64 --self-contained true -o dist/DFTDesk

      - name: Package minimal single-file release
        shell: pwsh
        run: |
          $exe = 'dist/DFTDesk/DFTDesk.exe'
          if (-not (Test-Path $exe -PathType Leaf)) {
            throw 'Single-file DFTDesk.exe was not created.'
          }
          $release = 'dist/DFTDesk-Release'
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          Copy-Item $exe (Join-Path $release 'DFTDesk.exe')
          Copy-Item LICENSE (Join-Path $release 'LICENSE-Filee.txt')
          Copy-Item tools/CrystalConverter/README.md (Join-Path $release 'README.txt')
          $actual = @(Get-ChildItem -Path $release -File | Select-Object -ExpandProperty Name | Sort-Object)
          $expected = @('DFTDesk.exe', 'LICENSE-Filee.txt', 'README.txt')
          if (@(Compare-Object $actual $expected).Count -ne 0) {
            throw "Unexpected release content: $($actual -join ', ')"
          }
          Get-ChildItem -Path $release | Format-Table Name,Length

      - name: Smoke-test isolated release EXE
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/DFTDesk-Release/DFTDesk.exe').Path
          $process = Start-Process -FilePath $exe -PassThru -ErrorAction Stop
          try {
            Start-Sleep -Seconds 6
            $process.Refresh()
            if ($process.HasExited) {
              throw "DFTDesk.exe exited during startup (code $($process.ExitCode))."
            }
            Write-Host 'Standalone GUI process is running from the minimal release directory.'
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Upload portable EXE
        uses: actions/upload-artifact@v7
        with:
          name: DFTDesk-win-x64
          path: dist/DFTDesk-Release/
          if-no-files-found: error
